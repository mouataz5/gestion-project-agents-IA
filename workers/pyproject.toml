[project]
name = "job-agent-workers"
version = "0.1.0"
description = "AI Job Application Agent - Celery workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "job-agent-backend",
]

[tool.uv.sources]
job-agent-backend = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_workers"]
