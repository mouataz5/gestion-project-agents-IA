[project]
name = "job-agent-backend"
version = "0.1.0"
description = "AI Job Application Agent - REST API and domain services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.20",
    "anthropic>=1.11",
    "celery[redis]>=5.6",
    "cryptography>=50.0",
    "fastapi>=0.141",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=6.4",
    "sqlalchemy>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
