# Alembic configuration for the job agent database.
# The database URL is NOT configured here: env.py reads DATABASE_URL from the application settings.
#
#   uv run alembic -c backend/alembic.ini upgrade head
#   uv run alembic -c backend/alembic.ini revision --autogenerate -m "describe change" --rev-id 0002

[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q REVISION_SCRIPT_FILENAME
