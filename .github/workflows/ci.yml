name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend & workers (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobagent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobagent:jobagent@localhost:5432/jobagent
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack + browser E2E
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env with random secrets
        run: python3 scripts/generate_env.py
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait until the API, the worker and the dashboard are ready
        run: |
          set -a && . ./.env && set +a
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null \
              && curl -fsS -H "Authorization: Bearer ${API_AUTH_TOKEN}" \
                   http://127.0.0.1:8000/api/v1/system/status \
                 | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin)["status"] != "ok")' \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "stack ready"; exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install Playwright
        working-directory: playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          set -a && . ./.env && set +a
          npm --prefix playwright test
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
